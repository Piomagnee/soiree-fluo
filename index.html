<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Soirée Fluo — Pionniers de Magnée</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
      background:
        radial-gradient(circle at 18% 0, #42106c 0, transparent 35%),
        radial-gradient(circle at 100% 22%, #07544d 0, transparent 34%),
        #08070d;
      padding: 22px 18px;
      display: flex;
      justify-content: center;
    }

    .app {
      width: min(460px, 100%);
    }

    .hero {
      text-align: center;
      margin: 8px 0 18px;
    }

    .badge {
      display: inline-block;
      border: 1px solid rgba(210,255,62,.55);
      background: rgba(210,255,62,.08);
      color: #d9ff66;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .12em;
    }

    h1 {
      font-size: 34px;
      line-height: 1;
      margin: 12px 0 5px;
      font-weight: 1000;
    }

    .sub {
      color: #aaa5b5;
      margin: 0;
    }

    .card {
      background: rgba(20,17,28,.95);
      border: 1px solid #382f45;
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 24px 70px rgba(0,0,0,.5);
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 850;
      color: #c9c4d1;
      margin-bottom: 8px;
    }

    .inputwrap {
      position: relative;
    }

    input {
      width: 100%;
      border: 1px solid #4a4059;
      background: #211c2b;
      color: white;
      border-radius: 17px;
      padding: 17px 58px 17px 17px;
      font-size: 27px;
      font-weight: 950;
      outline: none;
    }

    input:focus {
      border-color: #d2ff3e;
    }

    .euro {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #d2ff3e;
      font-size: 23px;
      font-weight: 950;
    }

    .quick {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .quick button {
      border: 1px solid #44384f;
      background: #282130;
      color: white;
      border-radius: 12px;
      padding: 12px 4px;
      font-weight: 850;
      font-size: 15px;
      cursor: pointer;
    }

    .quick button:active {
      transform: scale(.96);
      background: #d2ff3e;
      color: #08070d;
    }

    .payment {
      margin-top: 20px;
      text-align: center;
      padding-top: 19px;
      border-top: 1px solid #342b43;
    }

    .small {
      font-size: 12px;
      color: #8f8999;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .09em;
    }

    .amount {
      font-size: 50px;
      font-weight: 1000;
      line-height: 1;
      margin: 7px 0 17px;
      color: #d2ff3e;
    }

    .qr {
      display: inline-flex;
      background: white;
      border-radius: 22px;
      padding: 14px;
    }

    .qr img {
      display: block;
      width: min(260px, 67vw);
      height: min(260px, 67vw);
    }

    .hint {
      font-size: 13px;
      color: #aaa5b5;
      line-height: 1.45;
      margin: 13px auto 0;
      max-width: 330px;
    }

    .reset {
      width: 100%;
      margin-top: 15px;
      background: #26202f;
      border: 1px solid #463b54;
      color: white;
      border-radius: 15px;
      padding: 13px;
      font-weight: 850;
      font-size: 15px;
      cursor: pointer;
    }

    .details {
      text-align: center;
      color: #77717f;
      font-size: 11px;
      line-height: 1.5;
      margin: 14px 0;
    }
  </style>
</head>

<body>

<main class="app">

  <header class="hero">
    <span class="badge">PIONNIERS DE MAGNÉE</span>

    <h1>SOIRÉE FLUO</h1>

    <p class="sub">
      Paiement rapide par QR code
    </p>
  </header>

  <section class="card">

    <label for="amount">
      MONTANT À PAYER
    </label>

    <div class="inputwrap">
      <input
        id="amount"
        type="text"
        inputmode="decimal"
        placeholder="Ex. 12,50"
        autocomplete="off"
      >

      <span class="euro">€</span>
    </div>

    <div class="quick">
      <button data-value="5">5 €</button>
      <button data-value="10">10 €</button>
      <button data-value="15">15 €</button>
      <button data-value="20">20 €</button>
    </div>

    <div class="payment">

      <div class="small">
        Montant à payer
      </div>

      <div class="amount" id="display">
        5,00 €
      </div>

      <div class="qr">
        <img id="qr" alt="QR code de paiement">
      </div>

      <p class="hint">
        Scanne le QR avec ton application bancaire et vérifie
        le montant avant de confirmer.
      </p>

      <button class="reset" id="reset">
        Nouveau paiement
      </button>

    </div>

  </section>

  <p class="details">
    <strong>Scouts de Magnée</strong><br>
    BE60 0829 3880 9470<br>
    Communication : Soirée Fluo PI Magnée
  </p>

</main>

<script>

const BENEFICIARY = "Scouts de Magnée";
const IBAN = "BE60082938809470";
const BIC = "GKCCBEBB";
const COMMUNICATION = "Soiree Fluo PI Magnee";

const input = document.getElementById("amount");
const display = document.getElementById("display");
const qr = document.getElementById("qr");

function createPayment(amount) {

  if (!amount || amount <= 0 || amount > 1000) {
    return;
  }

  const formattedAmount = amount.toFixed(2);

  const paymentData =
`BCD
002
1
SCT
${BIC}
${BENEFICIARY}
${IBAN}
EUR${formattedAmount}


${COMMUNICATION}`;

  display.textContent =
    amount.toLocaleString("fr-BE", {
      style: "currency",
      currency: "EUR"
    });

  qr.src =
    "https://api.qrserver.com/v1/create-qr-code/?size=500x500&data="
    + encodeURIComponent(paymentData);
}


// SAISIE MANUELLE

input.addEventListener("input", function () {

  const amount =
    Number(input.value.replace(",", "."));

  createPayment(amount);

});


// BOUTONS 5 / 10 / 15 / 20 €

document.querySelectorAll("[data-value]").forEach(button => {

  button.addEventListener("click", function () {

    const amount =
      Number(button.dataset.value);

    input.value =
      amount.toString().replace(".", ",");

    createPayment(amount);

  });

});


// NOUVEAU PAIEMENT

document.getElementById("reset")
  .addEventListener("click", function () {

    input.value = "";
    input.focus();

  });


// QR affiché au démarrage

createPayment(5);

</script>

</body>
</html>
